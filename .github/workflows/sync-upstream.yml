name: Sync fork's main with upstream

# NOTE: this workflow file lives on the "tooling" branch (the fork's default
# branch, so schedule triggers fire), but it only ever reads/writes the
# "main" branch. "main" stays a pure mirror of upstream — no automation
# files are ever added to it.

on:
  schedule:
    # Daily at 03:00 UTC. Adjust to taste.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (not the default branch)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0  # full history needed for merge

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/medfm-flare/AwesomeBiomedicalAI.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream/main into main
        run: |
          git checkout main
          if git merge upstream/main --no-edit; then
            echo "OK: merged cleanly"
          else
            echo "::error::Merge conflict with upstream. Skipping auto-push. Resolve manually with 'git fetch upstream && git merge upstream/main'."
            git merge --abort
            exit 1
          fi

      - name: Push main
        run: git push origin main
