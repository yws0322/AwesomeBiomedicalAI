name: Watch multimodal biomedical papers

# Three jobs (discover -> screen -> notify) so the Actions run page still
# shows the pipeline as a graph. No PR is opened and multimodal.md is never
# touched by this workflow — it only emails you the candidate list. You (or
# Claude Code, using your subscription) do the actual reading/drafting/PR.

on:
  schedule:
    - cron: "0 9 * * 1"  # Every Monday 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      has_candidates: ${{ steps.run.outputs.has_candidates }}
    steps:
      - name: Checkout tooling
        uses: actions/checkout@v4
        with:
          ref: tooling

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Get multimodal.md from main (read-only, for dedup)
        run: |
          git fetch origin main
          git show origin/main:multimodal.md > /tmp/multimodal.md

      - name: Run discover
        id: run
        run: |
          python scripts/discover.py \
            --multimodal-md /tmp/multimodal.md \
            --seen-file candidates/.notified.json \
            --out candidates.json

      - uses: actions/upload-artifact@v4
        with:
          name: candidates
          path: candidates.json

  screen:
    needs: discover
    if: needs.discover.outputs.has_candidates == 'true'
    runs-on: ubuntu-latest
    outputs:
      has_accepted: ${{ steps.run.outputs.has_accepted }}
    steps:
      - name: Checkout tooling
        uses: actions/checkout@v4
        with:
          ref: tooling

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: candidates

      - name: Run screen
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/screen.py --in candidates.json --out accepted.json

      - uses: actions/upload-artifact@v4
        with:
          name: accepted
          path: accepted.json

  notify:
    needs: screen
    if: needs.screen.outputs.has_accepted == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling
        uses: actions/checkout@v4
        with:
          ref: tooling

      - uses: actions/download-artifact@v4
        with:
          name: accepted

      - name: Build email
        id: build
        run: |
          python scripts/notify.py \
            --in accepted.json \
            --seen-file candidates/.notified.json \
            --subject-out subject.txt \
            --body-out body.txt
          echo "subject=$(cat subject.txt)" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<EOF'
            cat body.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.build.outputs.subject }}
          to: ${{ secrets.MAIL_TO }}
          from: multimodal-watch
          body: ${{ steps.build.outputs.body }}

      - name: Commit updated notified-list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add candidates/.notified.json
          git diff --cached --quiet || git commit -m "chore: update notified candidates list"
          git push origin tooling
